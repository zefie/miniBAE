modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId        = "${mod_id}"
version      = "${mod_version}"
displayName  = "${mod_name}"
authors      = "${mod_authors}"
description  = '''${mod_description}'''

# Mixin that swaps Etched's built-in OGG/WAV/MP3 decoder cascade for the
# NeoBAE engine. See src/main/resources/neobaemc.mixins.json and
# com.zefie.neobaemc.mixin.AbstractOnlineSoundInstanceMixin.
[[mixins]]
config = "neobaemc.mixins.json"

[[dependencies.${mod_id}]]
    modId   = "neoforge"
    type    = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId   = "minecraft"
    type    = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Etched provides the music-disc UX (etching table, discs, URL download).
# NeoBAE plugs in as the decoder. Without Etched this mod has nothing to do.
[[dependencies.${mod_id}]]
    modId   = "etched"
    type    = "required"
    versionRange = "[5.0.0,)"
    ordering = "AFTER"
    side = "BOTH"
